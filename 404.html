  <style>
    :root { --accent:#3b50e0; --accent-2:#8b9bff; --bg:#fafafa; --card:#fff; --text:#0d0d0d; --muted:#6b6b6b; --line:#ebebeb; --btn:#0a0a0a; --btn-text:#fff; --t1:rgba(59,80,224,.07); --t1b:rgba(59,80,224,.26); --shadow:rgba(0,0,0,.09); --font:'Plus Jakarta Sans',sans-serif; --ease:cubic-bezier(.2,.8,.2,1); }
    :root[data-theme="dark"] { --accent:#8da2ff; --accent-2:#c6b8ff; --bg:#0a0b0f; --card:#14161d; --text:#f2f3f5; --muted:#9a9fab; --line:#23262f; --btn:#f2f3f5; --btn-text:#0a0b10; --t1:rgba(141,162,255,.12); --t1b:rgba(141,162,255,.38); --shadow:rgba(0,0,0,.45); color-scheme:dark; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; overflow:hidden; color:var(--text); background:var(--bg); font:15px/1.65 var(--font); -webkit-font-smoothing:antialiased; }
    body:before { content:''; position:fixed; left:50%; top:42%; width:640px; height:640px; margin:-320px 0 0 -320px; border-radius:50%; background:radial-gradient(circle,var(--t1b),transparent 65%); opacity:.55; animation:drift 10s ease-in-out infinite; pointer-events:none; }

    main { position:relative; width:min(100%,560px); text-align:center; }
    .code { display:flex; align-items:center; justify-content:center; gap:clamp(4px,1.5vw,12px); font-size:clamp(96px,26vw,190px); font-weight:800; line-height:1; letter-spacing:-.06em; animation:rise .9s var(--ease) both; }
    .eye { position:relative; display:inline-block; width:.62em; height:.62em; overflow:hidden; border-radius:50%; background:var(--text); animation:blink 5s infinite; }
    .eye i { position:absolute; left:50%; top:50%; width:.26em; height:.26em; margin:-.13em 0 0 -.13em; border-radius:50%; background:var(--bg); transform:translate(var(--ex,0),var(--ey,0)); transition:transform .08s linear; }
    @keyframes blink { 0%,94%,100% { transform:scaleY(1); } 97% { transform:scaleY(.08); } }
    @keyframes rise { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }
    h1 { margin:18px 0 10px; font-size:clamp(26px,5vw,36px); letter-spacing:-.04em; line-height:1.15; animation:rise .9s var(--ease) .12s both; }
    p { margin:0 auto; max-width:420px; color:var(--muted); animation:rise .9s var(--ease) .2s both; }
    .path { display:inline-block; max-width:100%; margin-top:16px; padding:6px 14px; overflow:hidden; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:var(--card); font:600 12px ui-monospace,Consolas,monospace; text-overflow:ellipsis; white-space:nowrap; animation:rise .9s var(--ease) .26s both; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:30px; animation:rise .9s var(--ease) .34s both; }
    .btn { position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:8px; padding:14px 26px; border:1px solid var(--line); border-radius:999px; color:var(--text); background:var(--card); font:700 14px var(--font); text-decoration:none; cursor:pointer; transition:transform .25s var(--ease), border-color .25s, box-shadow .25s; }
    .btn:hover { transform:translateY(-3px); border-color:var(--accent); }
    .btn:active { transform:scale(.94); }
    .btn.primary { border-color:var(--btn); color:var(--btn-text); background:var(--btn); }
    .btn:after { content:''; position:absolute; inset:0; background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%); transform:translateX(-130%); }
    .btn:hover:after { transform:translateX(130%); transition:transform .8s var(--ease); }
    .btn .arr { transition:transform .3s var(--ease); } .btn:hover .arr { transform:translateX(6px); }
    .links { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin-top:34px; animation:rise .9s var(--ease) .42s both; }
    .links a { color:var(--muted); font-size:13px; font-weight:600; text-decoration:none; transition:color .25s; }
    .links a:hover { color:var(--accent); }
    :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    @media (prefers-reduced-motion: reduce) { *, *:before, *:after { animation:none !important; transition:none !important; } }

  <script>
    document.getElementById('path').textContent = location.pathname.split('/').slice(-2).join('/') || '/';
    var eyes = [].slice.call(document.querySelectorAll('.eye'));
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) addEventListener('pointermove', function (e) {
      eyes.forEach(function (eye) {
        var r = eye.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), a = Math.atan2(dy, dx), d = Math.min(r.width * .22, Math.hypot(dx, dy) / 12);
        eye.style.setProperty('--ex', Math.cos(a) * d + 'px'); eye.style.setProperty('--ey', Math.sin(a) * d + 'px');
      });
    }, { passive: true });
  </script>
